<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ Logistics — RFQ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F3F3; --paper-2:#e5e5e5; --ink:#000000; --ink-soft:#4c5760;
    --line:#c7ccd0; --gold:#AB330B; --gold-deep:#8c2a09; --blue:#2F4553; --blue-soft:#e2e7ea;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}

  /* ---- login gate ---- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-box{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px;
    width:100%; max-width:360px;
  }
  .login-box h1{font-size:19px; margin-bottom:6px;}
  .login-box p{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px;}
  input, select, textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px;
    font-family:'Space Grotesk',sans-serif; font-size:14px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .btn{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;
    padding:11px 20px; border-radius:999px; border:1px solid var(--ink); color:var(--ink); background:#fff;
    transition:background .15s, color .15s;
  }
  .btn:hover{background:var(--ink); color:var(--paper);}
  .btn.solid{background:var(--ink); color:var(--paper);}
  .btn.solid:hover{background:var(--gold-deep); border-color:var(--gold-deep);}
  .btn.danger{border-color:#a33; color:#a33;}
  .btn.danger:hover{background:#a33; color:#fff;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-sm{padding:6px 12px; font-size:12px;}
  .error-msg{color:#a33; font-family:'IBM Plex Mono',monospace; font-size:12px; margin-top:10px; min-height:16px;}

  /* ---- dashboard ---- */
  #dashboard{display:none;}
  header.top{
    background:#fff; border-bottom:1px solid var(--line); padding:16px 0; position:sticky; top:0; z-index:5;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  .top-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px;}
  .brand .mark{width:28px; height:28px; background:var(--ink); color:var(--paper); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px;}
  .top-actions{display:flex; align-items:center; gap:10px;}

  main{padding:24px 0 60px;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
  .toolbar select, .toolbar input{width:auto; min-width:150px;}
  .toolbar input[type="search"]{min-width:220px;}
  .count{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-left:auto;}

  .rfq-table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .rfq-table th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--ink-soft); padding:12px 14px; border-bottom:1px solid var(--line); background:var(--paper-2);
  }
  .rfq-table td{padding:12px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:top;}
  .rfq-table tr:last-child td{border-bottom:none;}
  .rfq-table tr.row-new{background:#fbf3ef;}

  .badge{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 9px; border-radius:999px; background:var(--blue-soft); color:var(--blue);
  }
  .badge.gold{background:#f2e2da; color:var(--gold-deep);}

  select.status-select{
    padding:5px 8px; font-size:12px; border-radius:6px; min-width:auto;
  }

  .expand-btn{background:none; border:none; cursor:pointer; color:var(--blue); font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:0;}
  .detail-row td{background:var(--paper-2); font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); white-space:pre-wrap;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 24px;}
  .detail-grid .k{color:var(--ink); font-weight:600; margin-bottom:2px;}

  .empty-state{text-align:center; padding:60px 20px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft);}
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--ink); color:var(--paper); padding:12px 18px;
    border-radius:8px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; opacity:0; transform:translateY(8px);
    transition:opacity .2s, transform .2s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>RFQ Admin</h1>
    <p class="mono">Sign in with the admin password to review submissions.</p>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <button class="btn solid" id="login-btn" style="width:100%;">Sign in</button>
    <p class="error-msg" id="login-error"></p>
  </div>
</div>

<div id="dashboard">
  <header class="top">
    <div class="wrap top-row">
      <div class="brand"><span class="mark">MJ</span> RFQ Admin</div>
      <div class="top-actions">
        <button class="btn btn-sm" id="refresh-btn">Refresh</button>
        <button class="btn btn-sm" id="logout-btn">Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="reviewed">Reviewed</option>
        <option value="quoted">Quoted</option>
        <option value="won">Won</option>
        <option value="lost">Lost</option>
      </select>
      <select id="filter-commodity">
        <option value="">All commodities</option>
        <option value="parts">Parts</option>
        <option value="gold">Gold</option>
        <option value="diamond">Diamond</option>
      </select>
      <input type="search" id="filter-search" placeholder="Search company or email…" />
      <span class="count" id="result-count"></span>
    </div>

    <table class="rfq-table" id="rfq-table">
      <thead>
        <tr>
          <th></th>
          <th>Received</th>
          <th>Commodity</th>
          <th>Company</th>
          <th>Contact</th>
          <th>Quantity</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rfq-tbody"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">No RFQs match these filters.</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const state = { token: '', records: [], expanded: new Set() };

  const $ = (sel) => document.querySelector(sel);

  function showToast(msg, isError) {
    const t = $('#toast');
    t.textContent = msg;
    t.style.background = isError ? '#a33' : '#000';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Token': state.token,
        ...(opts.headers || {}),
      },
    });
    if (res.status === 401) {
      logout();
      throw new Error('Session expired — please sign in again.');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) {
      throw new Error(data.error || (data.errors && data.errors.join(', ')) || 'Request failed');
    }
    return data;
  }

  function logout() {
    state.token = '';
    sessionStorage.removeItem('mj_admin_token');
    $('#dashboard').style.display = 'none';
    $('#login-screen').style.display = 'flex';
  }

  async function login(password) {
    $('#login-error').textContent = '';
    $('#login-btn').disabled = true;
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error('Incorrect password');
      state.token = password;
      sessionStorage.setItem('mj_admin_token', password);
      $('#login-screen').style.display = 'none';
      $('#dashboard').style.display = 'block';
      await loadRecords();
    } catch (err) {
      $('#login-error').textContent = err.message;
    } finally {
      $('#login-btn').disabled = false;
    }
  }

  async function loadRecords() {
    try {
      const data = await api('/api/admin/rfqs');
      state.records = data.records || [];
      render();
    } catch (err) {
      showToast(err.message, true);
    }
  }

  async function updateStatus(id, status) {
    try {
      await api('/api/admin/rfqs/' + encodeURIComponent(id), {
        method: 'PATCH',
        body: JSON.stringify({ status }),
      });
      const rec = state.records.find((r) => r.id === id);
      if (rec) rec.status = status;
      showToast('Status updated');
      render();
    } catch (err) {
      showToast(err.message, true);
    }
  }

  async function deleteRecord(id) {
    if (!confirm('Delete this RFQ? This cannot be undone.')) return;
    try {
      await api('/api/admin/rfqs/' + encodeURIComponent(id), { method: 'DELETE' });
      state.records = state.records.filter((r) => r.id !== id);
      showToast('RFQ deleted');
      render();
    } catch (err) {
      showToast(err.message, true);
    }
  }

  function commodityBadge(c) {
    const cls = c === 'gold' || c === 'diamond' ? 'badge gold' : 'badge';
    return `<span class="${cls}">${c}</span>`;
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
      ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function getFiltered() {
    const status = $('#filter-status').value;
    const commodity = $('#filter-commodity').value;
    const search = $('#filter-search').value.trim().toLowerCase();
    return state.records.filter((r) => {
      if (status && r.status !== status) return false;
      if (commodity && r.commodity !== commodity) return false;
      if (search) {
        const hay = (r.company + ' ' + r.email).toLowerCase();
        if (!hay.includes(search)) return false;
      }
      return true;
    });
  }

  function render() {
    const list = getFiltered();
    $('#result-count').textContent = list.length + (list.length === 1 ? ' result' : ' results');
    const tbody = $('#rfq-tbody');
    tbody.innerHTML = '';
    $('#empty-state').style.display = list.length ? 'none' : 'block';

    list.forEach((r) => {
      const tr = document.createElement('tr');
      tr.className = r.status === 'new' ? 'row-new' : '';
      const isOpen = state.expanded.has(r.id);
      tr.innerHTML = `
        <td><button class="expand-btn" data-toggle="${r.id}">${isOpen ? '▾' : '▸'}</button></td>
        <td class="mono">${fmtDate(r.createdAt)}</td>
        <td>${commodityBadge(escapeHtml(r.commodity))}</td>
        <td>${escapeHtml(r.company)}</td>
        <td>${escapeHtml(r.contactName)}<br><span class="mono" style="color:var(--ink-soft); font-size:11.5px;">${escapeHtml(r.email)}</span></td>
        <td class="mono">${escapeHtml(r.quantity) || '—'}</td>
        <td>
          <select class="status-select" data-status="${r.id}">
            ${['new','reviewed','quoted','won','lost'].map((s) =>
              `<option value="${s}" ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </td>
        <td><button class="btn btn-sm danger" data-delete="${r.id}">Delete</button></td>
      `;
      tbody.appendChild(tr);

      if (isOpen) {
        const detailTr = document.createElement('tr');
        detailTr.className = 'detail-row';
        const td = document.createElement('td');
        td.colSpan = 8;
        td.innerHTML = `
          <div class="detail-grid">
            <div><div class="k">Phone</div>${escapeHtml(r.phone) || '—'}</div>
            <div><div class="k">Target price</div>${escapeHtml(r.targetPrice) || '—'}</div>
            <div style="grid-column:1 / -1;"><div class="k">Spec / details</div>${escapeHtml(r.spec)}</div>
            <div style="grid-column:1 / -1;"><div class="k">Notes</div>${escapeHtml(r.notes) || '—'}</div>
          </div>
        `;
        detailTr.appendChild(td);
        tbody.appendChild(detailTr);
      }
    });
  }

  document.addEventListener('click', (e) => {
    const toggleId = e.target.getAttribute && e.target.getAttribute('data-toggle');
    if (toggleId) {
      if (state.expanded.has(toggleId)) state.expanded.delete(toggleId);
      else state.expanded.add(toggleId);
      render();
    }
    const deleteId = e.target.getAttribute && e.target.getAttribute('data-delete');
    if (deleteId) deleteRecord(deleteId);
  });

  document.addEventListener('change', (e) => {
    const statusId = e.target.getAttribute && e.target.getAttribute('data-status');
    if (statusId) updateStatus(statusId, e.target.value);
  });

  $('#filter-status').addEventListener('change', render);
  $('#filter-commodity').addEventListener('change', render);
  $('#filter-search').addEventListener('input', render);
  $('#refresh-btn').addEventListener('click', loadRecords);
  $('#logout-btn').addEventListener('click', logout);
  $('#login-btn').addEventListener('click', () => login($('#password').value));
  $('#password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login($('#password').value); });

  // Resume session if we still have a token from this tab
  const saved = sessionStorage.getItem('mj_admin_token');
  if (saved) {
    state.token = saved;
    $('#login-screen').style.display = 'none';
    $('#dashboard').style.display = 'block';
    loadRecords().catch(() => logout());
  }
</script>
</body>
</html>
