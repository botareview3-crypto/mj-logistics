<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04261D"/>
      <stop offset=".55" stop-color="#0A4A3A"/>
      <stop offset="1" stop-color="#4F7268"/>
    </linearGradient>
    <radialGradient id="glow" cx="1060" cy="420" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A2B" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#FF6A2B" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FF6A2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d5a47"/>
      <stop offset="1" stop-color="#04261D"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9CFC2" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#A9CFC2" stop-opacity=".35"/>
      <stop offset="1" stop-color="#A9CFC2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cells" width="40" height="26" patternUnits="userSpaceOnUse">
      <rect width="40" height="26" fill="url(#panel)"/>
      <path d="M0 0H40M0 0V26" stroke="#A9CFC2" stroke-opacity=".28" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#sky)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>
  <g fill="none" stroke="#FF6A2B" stroke-opacity=".25">
    <circle cx="1060" cy="420" r="230"/>
    <circle cx="1060" cy="420" r="300" stroke-opacity=".14"/>
    <circle cx="1060" cy="420" r="380" stroke-opacity=".08"/>
  </g>
  <circle cx="1060" cy="420" r="160" fill="#FF6A2B"/>
  <rect y="700" width="1600" height="500" fill="#04261D"/>
  <!-- rows of panels in perspective -->
  <g>
    <path d="M-80 1200 L420 760 L1180 760 L1680 1200 Z" fill="#062f25"/>
    <g transform="translate(0 0)">
      <path d="M140 770 L560 770 L520 850 L60 850 Z" fill="url(#cells)"/>
      <path d="M620 770 L1000 770 L1010 850 L590 850 Z" fill="url(#cells)"/>
      <path d="M1060 770 L1460 770 L1560 850 L1080 850 Z" fill="url(#cells)"/>
      <path d="M20 900 L500 900 L450 1010 L-80 1010 Z" fill="url(#cells)"/>
      <path d="M570 900 L1030 900 L1045 1010 L540 1010 Z" fill="url(#cells)"/>
      <path d="M1100 900 L1600 900 L1720 1010 L1120 1010 Z" fill="url(#cells)"/>
      <path d="M-120 1070 L430 1070 L370 1200 L-200 1200 Z" fill="url(#cells)"/>
      <path d="M520 1070 L1060 1070 L1080 1200 L480 1200 Z" fill="url(#cells)"/>
      <path d="M1150 1070 L1720 1070 L1860 1200 L1170 1200 Z" fill="url(#cells)"/>
    </g>
    <path d="M60 850 L1560 850 M-80 1010 L1720 1010" stroke="#A9CFC2" stroke-opacity=".15" stroke-width="3"/>
    <path d="M300 760 L1500 1200" stroke="url(#sheen)" stroke-width="160" opacity=".5"/>
  </g>
  <path d="M0 700 H1600" stroke="#A9CFC2" stroke-opacity=".25" stroke-width="2"/>
</svg>
