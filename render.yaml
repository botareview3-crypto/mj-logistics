services:
  # FastAPI backend — powers only the /admin console.
  # Free tier: sleeps after 15 min idle (cold start ~30-60s), and since data
  # lives in memory it resets to the seed data on every restart/redeploy.
  #
  # The frontend is NOT deployed on Render — it's a static export uploaded
  # directly to Hostinger (see HOSTINGER-DEPLOY.md), so there's only one
  # service here.
  - type: web
    name: mj-logistics-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://mjlogisticsenterprise.com
